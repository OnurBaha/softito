<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>

<body class="bg-indigo-50 text-gray-800 font-sans min-h-screen p-8 flex flex-col items-center justify-center gap-6">
    <h1 class="tracking-tighter"><strong>(Tighter)</strong> Çok Dar</h1>
    <p class="tracking-tight"><strong>(Tight)</strong> Bu metin birbirine hafifçe yaklaştırılmıştır.</p>
    <h1 class="tracking-normal"><strong>(Normal)</strong> Normal</h1>
    <p class="tracking-wide"><strong>(Wide)</strong> Bu metin ise hafifçe birbirinden uzaklaştırılmıştır.</p>
    <button class="tracking-wider bg-blue-500 text-white p-2">
        <strong>(Wider)</strong> BUTON YAZISI GENİŞ
    </button>
    <h1 class="tracking-widest"><strong>(Widest)</strong> Çok Geniş (Widest)</h1>
    <!-- <p class="tracking-[0.2em]"><strong>([value] - Özel)</strong> Kendi belirlediğim özel aralık.</p>  -->

</body>

</html>
