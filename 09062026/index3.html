<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Property method</h1>
        <p></p>
    </div>
    <div>
        <h3>Nesne Oluşturma</h3>
        <div>
            <label>Marka</label>
            <input type="text" id="input-brand" value="Apple">
        </div>
        <br>
        <div>
            <label>Fiyat</label>
            <input type="number" id="input-price" value="50000">
        </div>
    </div>
    <br>
    <div>
        <button style="border: 3px;" id="btn-build">Oluştur</button>
        <div id="result">Oluşturulmadı</div>
    </div>
    

    <script>
        
        
        document.getElementById('btn-build').addEventListener('click', ()=>{
            const brand = document.getElementById('input-brand').value;
            const price = document.getElementById('input-price').value;

            const device ={
                brand,
                price,
                bilgi(){
                    return `${this.brand} markalı cihaz, ${this.price} TL fiyatındadır.`;
                }

            }
            document.getElementById('result').innerHTML=`
            <div>Oluşan Nesne:${JSON.stringify({marka:device.brand, fiyat:device.price})}</div>
            <div>device.bilgi() sonucu:<span>${device.bilgi()}</span></div>
            `
        })
    </script>
</body>
</html>
