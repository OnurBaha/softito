<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="p-6 bg-gray-200">
    <div class="p-6 bg-white">
        <h1 class="text-xl font-bold">Aşırı Mini E Ticaret Sepet Yönetimi</h1>
        <div class="p-4 border">
            <h2 class="text-lg font-bold">Ürün Katalog</h2>
            <div class="mb-2">
                <input type="text" id="search-input" placeholder="Ürün Adı" class="p-2 border">
            </div>
            <button id="btn-search" class="p-2 bg-blue-200">Katalog Güncelle</button>
            <div class="mt-4 space-y-2" id="product-list">
                <p class="text-gray-500"> Ürün Listesini Yüklemek için Butona Tıklayın</p>
            </div>
        </div>

        <div class="mt-2"></div>

        <div class="p-2 border">
            <h2 class="text-lg font-bold">Alışveriş Sepetim</h2>
            <ul class="list-disc pl-5 space-y-1" id="card-list">
                <li>Sepetiniz Boş</li>
            </ul>
            <div class="mt-2 font-bold">
                Toplam Tutar: <span id="card-total">0</span> TL
            </div>
            <button class="p-2 bg-green-200 mt-2" id="btn-checkout">Alışverişi Tamamla</button>
        </div>

        <div id="status" class="p-2 border">
            Sistem Hazır
        </div>

    </div>

    <script>
        const yedekUrunler = [
            {'id':1, 'title':'akıllı Telefon', 'kategori':'Elektronik', 'fiyat':'15000', 'stok':5},
            {'id':2, 'title':'playstation', 'kategori':'Elektronik', 'fiyat':'25000', 'stok':12},
            {'id':3, 'title':'T-Shirt', 'kategori':'Giyim', 'fiyat':'1200', 'stok':30},
            {'id':4, 'title':'Boxer', 'kategori':'İç Giyim', 'fiyat':'150', 'stok':43},
            {'id':5, 'title':'Tablet', 'kategori':'Elektronik', 'fiyat':'10000', 'stok':2},
            {'id':6, 'title':'Spor Ayakkabı', 'kategori':'Ayakkabı', 'fiyat':'3300', 'stok':11},
            {'id':7, 'title':'Hamburger', 'kategori':'Yemek', 'fiyat':'1500', 'stok':50},
            {'id':8, 'title':'Pilav', 'kategori':'Yemek', 'fiyat':'15000', 'stok':0},
            {'id':9, 'title':'Gömlek', 'kategori':'Giyim', 'fiyat':'15000', 'stok':100},
            {'id':10, 'title':'Çorap', 'kategori':'Giyim', 'fiyat':'15000', 'stok':14},
        ]

        let sepet = [];

        const urunleriSorgula=async()=>{
            const searchVal=document.getElementById('search-input').value.toLowerCase();
            const listDiv=document.getElementById('product-list');
            const status = document.getElementById('status');

            status.innerText = 'Ürünler Listeleniyor...';
            status.className = 'p-2 border';

            let urunler = [];

            try{
                const response = await axios.get('https://kodusta.com/api/urunler.json');
                urunler=response.data;
            }catch(hata){
                console.warn('Cors hatası veya bağlantı hatası');
                urunler = yedekUrunler
            }

            const filtrelenmis = urunler.filter(u=>u.title.toLowerCase().includes(searchVal));

            listDiv.innerHTML ='';
            if(filtrelenmis.length===0){
                listDiv.innerHTML = `<p class='p-2 text-red-500'> Ürün Bulunamadı></p>`;
                return;
            } 
            
            filtrelenmis.forEach(urun=>{
                const itemDiv = document.createElement('div');
                itemDiv.className = "p-2 border";

                itemDiv.innerHTML = `<strong> ${urun.title}</strong> - Kategori: ${urun.kategori}<br>
                Fiyat:${urun.fiyat}TL  | Stok:${urun.stok > 0 ? urun.stok : 'Tükenmiş'}<br>
                <button class="p-1 bg-yellow-200 text-xs" onclick="sepeteEkleTiklandi(${urun.id})"> Sepete Ekle </button> `;

                listDiv.appendChild(itemDiv);
            })
        }
        const stokKontrolEt = (urun)=>{
            return new Promise ((resolve, reject)=>{
                setTimeout(()=>{
                    if(urun && urun.stok >0){
                        resolve('urun stokta mevcut sepete ekleniyor');
                    }else{
                        reject(`Hata:${urun.title} stokta kalmadığı için sepete eklenemedi`)
                    }
                }, 500)
            })
        }

        const sepetGuncelle = (callback)=>{
            const cardList = document.getElementById('card-list');
            cardList.innerHTML = '';

            sepet.forEach(item=>{
                const li = document.createElement('li');
                li.innerText = `
                    ${item.title}-${item.fiyat}TL
                `;
                cardList.appendChild(li);
            })
        const toplam = sepet.reduce((toplam, item) => toplam + item.fiyat, 0);
        callback(toplam);
        }

        window.sepeteEkleTiklandi = async(urunId) =>{
            const status = document.getElementById('status');
            status.innerText = "Stok sorgulanıyor...";
  
            status.className = "p-2 border";

        const urun = yedekUrunler.find(u => u.id === urunId);
        try{
            const stokMesaji=await stokKontrolEt(urun);
            sepet.push(urun);
            sepetGuncelle((faturaTutari)=>{
                document.getElementById('card-total').innerText=faturaTutari;
                status.className='p-2 bg-gren-200';
                status.innerText=`${urun.title} basariyla sepete eklendi. Toplam Sepet Tutarınız: ${faturaTutari}TL`;

            })
        }catch(hata){
            status.className='p-2 bg-red-200';
            status.innerText=hata.message ? hata.message:hata;

        }
    }


    const siparisiTamamla=async()=>{
        const status=document.getElementById('status');
        if(sepet.length===0){
            status.className='p-2 bg-re-200';
            status.innerText='Hata: sepetiniz bos oldugu icin siparis veremezsiniz.';
        }


        status.innerText='siparisiniz sunucuya (satıcıya) gonderiliyor..';
        status.className='border p-2';



        try{
            const response=await fetch('https://jsonplaceholder.typicode.com/posts',{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                siparisler:sepet,
                toplamTutar:Number(document.getElementById('card-total').innerText)
            })

            })
            if(!response.ok){
                throw new Error('Siparis sunucu tarafından rededildi');

            }


            const cevap=await reponse.json();
            status.className='p-2 bg-green-200';
            status.innerHTML=`Siparis basarıyla alındı! siparis kodu:${cevap.id} (sepetiniz sıfırlandı)`;

            sepet=[];
            sepetGuncelle((faturaTutari)=>{
                document.getElementById('card-total').innerText=faturaTutari;
                document.getElementById('card-list').innerHTML='<li>Sepetiniz Bos</li>';
            })
               

            
        }catch(hata){
            status.className="p-2 bg-red-200"
            status.innerText="siparis hatası"+hata.message;

        }
    }
    document.getElementById('btn-search').addEventListener('click',urunleriSorgula);
    document.getElementById('btn-checkout').addEventListener('click',siparisiTamamla);

    </script>
</body>
</html>
