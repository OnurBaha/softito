<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervasyon Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.0.4/typescript.min.js"></script>
</head>
<body class="p-6 bg-gray-200">
    <div class="p-6 bg-white max-w-md mx-auto rounded shadow">
        <h1 class="text-xl font-bold mb-4">Etkinlik Rezervasyon</h1>
        
        <div class="space-y-2 mb-4">
            <input type="text" id="inp-name" placeholder="Müşteri Adı" class="p-1 border w-full">
            <input type="number" id="inp-koltuk" placeholder="Koltuk No" class="p-1 border w-full" value="10">
            <input type="text" id="inp-not" placeholder="Özel Not (Opsiyonel)" class="p-1 border w-full">
        </div>

        <button class="p-2 bg-indigo-200 w-full mb-4" id="btn-reserve">Rezervasyon Yap</button>
        <div id="result" class="p-2 border text-sm">Henüz Rezervasyon Yapılmadı</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('script[type="text/typescript"]').forEach(script => {
                const js = window.ts.transpile(script.textContent);
                const newScript = document.createElement('script');
                newScript.textContent = js;
                document.body.appendChild(newScript);
            });
        });
    </script>

    <script type="text/typescript">
        interface Rezervasyon {
            readonly biletKodu: string; 
            musteriAdi: string;
            koltukNo: number;
            ozelNot?: string;
        }

        const out = document.getElementById('result') as HTMLDivElement;

        document.getElementById('btn-reserve').addEventListener('click', () => {
            const ad: string = (document.getElementById('inp-name') as HTMLInputElement).value;
            const koltuk: number = Number((document.getElementById('inp-koltuk') as HTMLInputElement).value);
            const not: string = (document.getElementById('inp-not') as HTMLInputElement).value;

            if (ad === "") {
                out.innerText = "Lütfen müşteri adı giriniz!";
                return;
            }

            const yeniRezervasyon: Rezervasyon = {
                biletKodu: "BLT-" + Math.floor(Math.random() * 1000),
                musteriAdi: ad,
                koltukNo: koltuk
            };

            if (not !== "") {
                yeniRezervasyon.ozelNot = not;
            }

            out.className = 'mt-4 p-2 bg-green-200 text-sm';
            out.innerHTML = `
                <strong>Rezervasyon Onaylandı!</strong><br>
                Bilet Kodu: ${yeniRezervasyon.biletKodu}<br>
                İsim: ${yeniRezervasyon.musteriAdi}<br>
                Koltuk: ${yeniRezervasyon.koltukNo}<br>
                Not: ${yeniRezervasyon.ozelNot ? yeniRezervasyon.ozelNot : "Not Yok"}
            `;
        });
    </script>
</body>
</html>
